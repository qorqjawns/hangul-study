<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>동물 친구 한글 사진 놀이터</title>
<style>
:root{--ink:#182b49;--muted:#66758b;--paper:#fffdf9;--cream:#fff7e8;--line:#e9d9c6;--mint:#56c79d;--mint-dark:#1d8d6b;--yellow:#ffd86e;--orange:#ff9e5b;--pink:#f8b5d1;--blue:#bde7f8;--danger:#e75a5a;--shadow:0 3px 0 rgba(24,43,73,.08)}
*{box-sizing:border-box}body{margin:0;background:#fffaf2;color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}button,select{font:inherit;color:inherit}button{cursor:pointer;border:0}button:active{transform:translateY(2px)}
.hidden{display:none!important}.app{width:min(1120px,100%);margin:0 auto;padding:12px 16px 28px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 4px 14px}.brand{font-size:clamp(20px,3vw,29px);font-weight:900;letter-spacing:-1px}.brand span{color:var(--mint-dark)}.tiny-btn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 13px;font-size:14px;font-weight:800}.tiny-btn:hover{border-color:var(--mint)}
#pickScreen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff9dd 0%,#f8efff 100%)}.pick-card{width:min(900px,100%);background:rgba(255,255,255,.92);border:3px solid #ead8bc;border-radius:30px;padding:clamp(24px,5vw,48px);text-align:center;box-shadow:var(--shadow)}.pick-card h1{margin:0;font-size:clamp(33px,6vw,58px);letter-spacing:-3px}.pick-card p{margin:14px 0 30px;color:#516078;font-size:clamp(16px,2.5vw,21px)}.animal-choice{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.animal{background:#fff;border:3px solid var(--line);border-radius:22px;padding:15px 8px;font-size:clamp(16px,2vw,20px);font-weight:900}.animal .emoji{display:block;font-size:clamp(43px,6vw,70px);margin-bottom:7px}.animal:hover,.animal:focus{border-color:var(--mint);background:#edfff8;outline:none}
.control-panel{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 13px;box-shadow:var(--shadow)}.friend{font-size:19px}.level-pills{display:flex;gap:6px}.level{padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:15px}.level.active{background:#dcf8eb;border-color:var(--mint);color:#087454}.day-select{min-width:180px;max-width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:15px;font-weight:800}.voice-status{font-size:12px;color:var(--muted);text-align:right;max-width:280px}.voice-status strong{color:var(--mint-dark)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:17px 0 19px;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:white}.tab{padding:15px 8px;background:#fff;border-right:1px solid var(--line);font-size:16px;font-weight:900}.tab:last-child{border-right:0}.tab.active{background:#e5fbf1;color:#087454}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:clamp(14px,3vw,26px);min-height:580px}.section-title{text-align:center;margin:4px 0 4px;font-size:clamp(28px,4vw,40px);letter-spacing:-2px}.section-note{text-align:center;color:var(--muted);font-size:15px;margin:0 0 16px}.progress{text-align:center;font-size:14px;color:#6b5d52;margin:2px 0 10px}.progress b{color:var(--ink)}
.learn-card{max-width:900px;margin:auto}.photo-wrap{position:relative;width:min(100%,720px);height:clamp(270px,46vw,410px);margin:0 auto;border:5px solid #c7ebfa;border-radius:28px;overflow:hidden;background:#eff9fe}.photo-wrap.quiz-photo{width:min(100%,520px);height:clamp(250px,42vw,390px);border-color:#efb8d4}.photo-wrap img{width:100%;height:100%;object-fit:contain;background:#f6fafc;display:block}.photo-wrap.loading:after{content:'정확한 사진을 찾고 있어요…';position:absolute;inset:0;display:grid;place-items:center;color:#406078;font-size:18px;background:#eef9ff}.photo-empty{height:100%;display:grid;place-items:center;text-align:center;padding:20px;color:#4b6178;font-size:18px;line-height:1.5}.photo-error-btn{background:white;border:2px solid var(--mint);border-radius:13px;color:#087454;padding:10px 14px;margin-top:10px}.photo-credit{width:min(100%,720px);min-height:22px;margin:6px auto 2px;text-align:right;font-size:12px;color:#6a778b}.photo-credit a{color:#466d9e;text-decoration:underline}.word{font-size:clamp(75px,14vw,148px);line-height:1.05;text-align:center;letter-spacing:-9px;margin:8px 0 16px;font-weight:900}.word-btn{display:block;margin:0 auto 14px;background:#fff3df;border:3px solid var(--orange);border-radius:18px;padding:13px 22px;font-size:18px;font-weight:900}.word-btn:hover{background:#ffe3bc}.bottom-actions{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:10px;max-width:900px;margin:18px auto 0}.nav-btn{min-height:66px;border-radius:18px;background:white;border:2px solid var(--line);font-size:17px;font-weight:900}.next-btn{background:var(--mint);color:white;border:3px solid #35aa80;font-size:clamp(20px,3.1vw,27px);letter-spacing:-1px;box-shadow:0 4px 0 #2d956f}.next-btn:hover{background:#38b98d}.prev-btn:disabled{opacity:.4;cursor:default}.thumbs{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:21px auto 0;max-width:900px}.thumb{min-height:55px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:13px}.thumb.current{background:#fff0d3;border-color:var(--orange);color:#8b4d19}.thumb.done{border-color:var(--mint);background:#effbf5}
.mode-row{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:5px 0 16px}.mode{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 17px}.mode.active{background:#e5fbf1;border-color:var(--mint);color:#087454}.all-layout{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(280px,1fr);gap:22px;align-items:start}.all-focus{position:sticky;top:8px}.all-focus .photo-wrap{height:300px}.all-focus .word{font-size:clamp(62px,9vw,98px)}.all-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:650px;overflow:auto;padding:4px}.all-word{min-height:62px;background:#fff;border:2px solid var(--line);border-radius:12px;font-size:16px;font-weight:900}.all-word.current{background:#fff0d3;border-color:var(--orange)}.all-word small{display:block;color:#8190a1;font-size:11px;margin-bottom:2px}.text-only-box{border:4px dashed #f3bb77;background:#fff9e9;border-radius:24px;min-height:300px;display:grid;place-items:center;padding:15px}.text-only-box button{background:transparent;font-size:clamp(75px,14vw,148px);font-weight:900;color:var(--ink);letter-spacing:-8px}.text-only-box p{grid-column:1;color:var(--muted);font-size:14px;margin:0 0 12px}
.quiz-box{text-align:center}.hint{margin:10px auto 16px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 15px;font-size:16px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:840px;margin:18px auto}.choice{min-height:75px;background:#fff;border:3px solid var(--line);border-radius:18px;font-size:clamp(19px,3vw,27px);font-weight:900}.choice:hover{border-color:var(--mint);background:#effbf5}.choice.correct{background:#daf8e9;border-color:var(--mint);color:#087454}.choice.wrong{background:#ffeaeb;border-color:var(--danger);color:#a92b2b}.cheer{min-height:40px;font-size:22px;font-weight:900;color:#0a966c;margin:3px}.quiz-next{margin-top:9px;min-width:210px;min-height:58px;background:var(--mint);border:3px solid #35aa80;color:#fff;border-radius:18px;font-size:20px;font-weight:900}.wrong-list{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;max-width:880px;margin:20px auto}.wrong-card{min-height:84px;border:3px solid #f1c4bc;background:#fff;border-radius:16px;font-size:20px;font-weight:900}.empty{text-align:center;padding:70px 10px;color:var(--muted);font-size:19px}.empty strong{display:block;color:var(--mint-dark);font-size:28px;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(110px);background:#213a59;color:white;border-radius:14px;padding:12px 17px;z-index:20;transition:transform .25s ease;box-shadow:var(--shadow);text-align:center;font-size:14px}.toast.show{transform:translateX(-50%) translateY(0)}.burst{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}.confetti{position:absolute;top:46%;left:50%;width:14px;height:14px;border-radius:2px;animation:fly .85s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media(max-width:760px){.app{padding:9px 10px 22px}.topbar{padding-bottom:9px}.control-panel{grid-template-columns:1fr 1fr;gap:8px}.friend{font-size:17px}.day-select{grid-column:span 2;width:100%}.voice-status{display:none}.tabs{margin:11px 0 12px}.tab{font-size:14px;padding:13px 4px}.panel{border-radius:19px;min-height:530px;padding:14px 10px}.photo-wrap{border-radius:21px;height:clamp(240px,62vw,355px)}.word{font-size:clamp(80px,19vw,120px)}.thumbs{grid-template-columns:repeat(5,1fr)}.bottom-actions{grid-template-columns:1fr 1.8fr 1fr}.nav-btn{font-size:14px;min-height:61px}.next-btn{font-size:19px}.all-layout{grid-template-columns:1fr}.all-focus{position:static}.all-focus .photo-wrap{height:270px}.all-grid{grid-template-columns:repeat(4,1fr);max-height:none}.choice-grid{gap:8px}.choice{min-height:64px;font-size:18px}.wrong-list{grid-template-columns:repeat(3,1fr)}}
@media(max-width:460px){.animal-choice{grid-template-columns:repeat(3,1fr)}.animal{padding:10px 4px}.tabs{border-radius:12px}.tab{font-size:12px}.all-grid{grid-template-columns:repeat(3,1fr)}.bottom-actions{gap:6px}.next-btn{font-size:17px}.photo-wrap{border-width:4px}}
</style>
</head>
<body>
<section id="pickScreen">
  <div class="pick-card">
    <h1>동물 친구와<br><span style="color:#1d8d6b">한글 사진 놀이</span></h1>
    <p>좋아하는 친구를 누르면 한글 공부가 시작돼요.</p>
    <div class="animal-choice" id="animalChoices"></div>
    <p style="font-size:13px;margin:25px 0 0;color:#7b8796">사진은 카드가 열릴 때 Wikimedia Commons에서 단어와 맞는 사진을 찾아 보여 줘요.</p>
  </div>
</section>
<main id="mainApp" class="app hidden">
  <header class="topbar"><div class="brand"><span id="friendEmoji">🐶</span> <span id="friendName">강아지</span>와 한글 놀이</div><button class="tiny-btn" id="changeFriend">친구 바꾸기</button></header>
  <section class="control-panel">
    <div class="friend">단계</div>
    <div class="level-pills" id="levelPills"></div>
    <select aria-label="오늘의 카드 날짜" class="day-select" id="daySelect"></select>
    <div class="voice-status" id="voiceStatus">목소리를 확인하고 있어요…</div>
  </section>
  <nav class="tabs" aria-label="학습 메뉴">
    <button class="tab active" data-tab="today">오늘의 20장</button>
    <button class="tab" data-tab="all">전체 카드</button>
    <button class="tab" data-tab="quiz">그림 퀴즈</button>
    <button class="tab" data-tab="wrong">오답 노트</button>
  </nav>
  <section class="panel" id="content"></section>
</main>
<div class="toast" id="toast"></div><div class="burst" id="burst"></div>

const KEY='photo-hangul-600-v1';

const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify({friend:state.friend,level:state.level,day:state.day,done:state.done,wrong:state.wrong}));}catch(e){}}

function currentCards(){return LEVELS[state.level]}

function doneKey(){return 'l'+state.level+'d'+state.day}

function markDone(card){const k=doneKey();const d=new Set(state.done[k]||[]);d.add(card.id);state.done[k]=[...d];save()}
function wrongForLevel(){return state.wrong['l'+state.level]||[]}
function addWrong(card){const k='l'+state.level;const a=new Set(state.wrong[k]||[]);a.add(card.id);state.wrong[k]=[...a];save()}
function removeWrong(card){const k='l'+state.level;state.wrong[k]=(state.wrong[k]||[]).filter(id=>id!==card.id);save()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3000)}
function burst(){const wrap=$('#burst');wrap.innerHTML='';const colors=['#ffd45a','#f5a6c8','#5fc9a0','#7bc7f2','#ff9d62'];for(let i=0;i<26;i++){const d=document.createElement('i');d.className='confetti';d.style.background=colors[i%colors.length];d.style.setProperty('--x',((Math.random()-.5)*550)+'px');d.style.setProperty('--y',((Math.random()-.5)*440)+'px');wrap.appendChild(d)}setTimeout(()=>wrap.innerHTML='',1000)}
function speak(text){if(!('speechSynthesis' in window)){toast('이 브라우저에서는 읽기 기능을 지원하지 않아요.');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.82;u.pitch=1.08;if(chosenVoice)u.voice=chosenVoice;window.speechSynthesis.speak(u)}
function setupVoices(){if(!('speechSynthesis' in window)){ $('#voiceStatus').textContent='이 브라우저는 음성 읽기를 지원하지 않아요.';return; }voices=window.speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)||/korean|한국어/i.test(v.name));const sunhi=voices.find(v=>/microsoft\s*sun\s*hi/i.test(v.name));const female=voices.find(v=>/sunhi|heami|female|woman|여성/i.test(v.name));chosenVoice=sunhi||female||voices[0]||null;const s=$('#voiceStatus');if(sunhi){s.innerHTML='<strong>Microsoft SunHi</strong> 여성 목소리를 사용해요.'}else if(chosenVoice){s.innerHTML='<strong>Microsoft SunHi를 찾지 못했어요.</strong> 현재 기기 목소리: '+esc(chosenVoice.name)}else{s.textContent='한국어 목소리를 찾지 못했어요. 기기 설정에서 Microsoft SunHi를 설치해 주세요.'}}

function showApp(){if(!state.friend)return;$('#pickScreen').classList.add('hidden');$('#mainApp').classList.remove('hidden');$('#friendEmoji').textContent=state.friend.e;$('#friendName').textContent=state.friend.n;renderControls();render()}
function renderControls(){const pills=$('#levelPills');pills.innerHTML='';['5살','6살','7살'].forEach((x,i)=>{const b=document.createElement('button');b.className='level '+(state.level===i?'active':'');b.textContent=x;b.addEventListener('click',()=>{state.level=i;state.day=0;state.todayIndex=0;state.allIndex=0;state.quiz=null;renderControls();render()});pills.appendChild(b)});const ds=$('#daySelect');ds.innerHTML='';for(let i=0;i<10;i++){const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'일차 · 카드 '+(i*20+1)+'–'+(i+1)*20;ds.appendChild(o)}ds.value=state.day;ds.onchange=()=>{state.day=Number(ds.value);state.todayIndex=0;save();render()}}
function render(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.tab));if(state.tab==='today')renderToday();if(state.tab==='all')renderAll();if(state.tab==='quiz')renderQuiz();if(state.tab==='wrong')renderWrong()}
function photoHTML(prefix,card,quiz=false){const id=prefix+'-photo';return '<div class="photo-wrap '+(quiz?'quiz-photo':'')+' loading" id="'+id+'"><div class="photo-empty">사진을 찾고 있어요…</div></div><div class="photo-credit" id="'+prefix+'-credit"></div>'}
async function getPhotoCandidates(card){const cacheKey='photo-cache-2-'+card.id;try{const cache=JSON.parse(localStorage.getItem(cacheKey)||'null');if(cache&&cache.url&&!usedTitles.has(cache.title))return [cache]}catch(e){}
const query=encodeURIComponent(card.search+' filetype:bitmap');const url='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=24&gsrsearch='+query+'&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=1000';
const res=await fetch(url,{cache:'force-cache'});if(!res.ok)throw new Error('photo search unavailable');const json=await res.json();const pages=Object.values((json.query&&json.query.pages)||{});const keys=card.keys.map(x=>x.toLowerCase());const ok=pages.map(p=>{const ii=p.imageinfo&&p.imageinfo[0];if(!ii||!ii.thumburl||!/^image\/(jpeg|png)$/i.test(ii.mime||''))return null;const title=(p.title||'').replace(/^File:/i,'').toLowerCase();let hits=keys.reduce((n,k)=>n+(title.includes(k)?1:0),0);if(hits===0)return null;return {title:p.title,url:ii.thumburl,source:ii.descriptionurl||('https://commons.wikimedia.org/wiki/'+encodeURIComponent(p.title)),hits:hits,wide:(ii.width||0)*(ii.height||0)};}).filter(Boolean).sort((a,b)=>b.hits-a.hits||b.wide-a.wide);return ok}
async function loadPhoto(prefix,card,quiz=false){const nonce=++photoNonce;const wrap=$('#'+prefix+'-photo'),credit=$('#'+prefix+'-credit');if(!wrap)return;wrap.classList.add('loading');wrap.innerHTML='<div class="photo-empty">정확한 사진을 찾고 있어요…</div>';credit.textContent='';try{const candidates=await getPhotoCandidates(card);if(nonce!==photoNonce||!$('#'+prefix+'-photo'))return;const result=candidates.find(x=>!usedTitles.has(x.title))||candidates[0];if(!result)throw new Error('No strict photo title');usedTitles.add(result.title);try{localStorage.setItem('photo-cache-2-'+card.id,JSON.stringify(result))}catch(e){}wrap.classList.remove('loading');const img=document.createElement('img');img.alt=quiz?'그림 퀴즈 사진':card.word+' 사진';img.src=result.url;img.referrerPolicy='no-referrer';img.onerror=()=>showPhotoError(prefix,card,quiz);wrap.innerHTML='';wrap.appendChild(img);if(!quiz){wrap.style.cursor='pointer';wrap.title='사진을 누르면 단어를 읽어 줘요';wrap.onclick=()=>speak(card.word)}credit.innerHTML='사진: <a target="_blank" rel="noopener" href="'+esc(result.source)+'">Wikimedia Commons에서 보기</a> · <button class="photo-error-btn" style="padding:3px 7px;margin:0;font-size:11px" id="'+prefix+'-again">다른 사진</button>';const again=$('#'+prefix+'-again');if(again)again.addEventListener('click',()=>{try{localStorage.removeItem('photo-cache-2-'+card.id)}catch(e){};loadPhoto(prefix,card,quiz)});}catch(e){if(nonce===photoNonce)showPhotoError(prefix,card,quiz)}}
function showPhotoError(prefix,card,quiz){const wrap=$('#'+prefix+'-photo'),credit=$('#'+prefix+'-credit');if(!wrap)return;wrap.classList.remove('loading');wrap.innerHTML='<div class="photo-empty">이 단어와 정확히 맞는 사진을 찾지 못했어요.<br><button class="photo-error-btn" id="'+prefix+'-retry">사진 다시 찾기</button></div>';if(credit)credit.textContent='사진 검색: Wikimedia Commons';const retry=$('#'+prefix+'-retry');if(retry)retry.addEventListener('click',()=>loadPhoto(prefix,card,quiz))}
function renderToday(){const cards=todayCards();if(state.todayIndex>=cards.length)state.todayIndex=0;const card=cards[state.todayIndex];const d=new Set(currentDone());$('#content').innerHTML='<h1 class="section-title">오늘의 20장</h1><p class="section-note">사진을 누르거나 큰 글자를 누르면 읽어 줘요.</p><div class="progress"><b>'+ (state.todayIndex+1)+' / 20</b> · 오늘 배운 카드 '+d.size+'장</div><div class="learn-card">'+photoHTML('today',card)+ '<button class="word-btn" id="todayWord" aria-label="'+esc(card.word)+' 읽기">🔊 크게 읽어 보기</button><div class="word" id="todayText">'+esc(card.word)+'</div><div class="bottom-actions"><button class="nav-btn prev-btn" id="prevToday" '+(state.todayIndex===0?'disabled':'')+'>← 이전</button><button class="nav-btn next-btn" id="nextToday">다음 카드 →</button><button class="nav-btn" id="repeatToday">🔊 다시</button></div><div class="thumbs" id="todayThumbs"></div></div>';
$('#todayWord').onclick=()=>speak(card.word);$('#todayText').onclick=()=>speak(card.word);$('#todayText').style.cursor='pointer';$('#repeatToday').onclick=()=>speak(card.word);$('#prevToday').onclick=()=>{if(state.todayIndex>0){state.todayIndex--;renderToday()}};$('#nextToday').onclick=()=>{markDone(card);if(state.todayIndex<19){state.todayIndex++;renderToday()}else{toast('오늘의 20장을 모두 봤어요!');burst();renderToday()}};const th=$('#todayThumbs');cards.forEach((c,i)=>{const b=document.createElement('button');b.className='thumb '+(i===state.todayIndex?'current ':'')+(d.has(c.id)?'done':'');b.innerHTML='<small>'+(i+1)+'번</small>'+esc(c.word);b.onclick=()=>{state.todayIndex=i;renderToday()};th.appendChild(b)});loadPhoto('today',card)}
function renderAll(){const cards=currentCards();if(state.allIndex>=cards.length)state.allIndex=0;const card=cards[state.allIndex];const visual=state.allMode==='photo';$('#content').innerHTML='<h1 class="section-title">전체 카드</h1><p class="section-note">200장을 번호 순서대로 볼 수 있어요. <b>글자만 듣기</b>는 그림 없이 글자를 눌러 읽는 연습이에요.</p><div class="mode-row"><button class="mode '+(visual?'active':'')+'" id="modePhoto">사진 카드</button><button class="mode '+(!visual?'active':'')+'" id="modeText">글자만 듣기</button></div><div class="all-layout"><div class="all-focus" id="allFocus"></div><div class="all-grid" id="allGrid"></div></div>';
const focus=$('#allFocus');if(visual){focus.innerHTML=photoHTML('all',card)+'<button class="word-btn" id="allSpeak">🔊 단어 읽기</button><div class="word" id="allWord">'+esc(card.word)+'</div><div class="bottom-actions"><button class="nav-btn" id="allPrev" '+(state.allIndex===0?'disabled':'')+'>← 이전</button><button class="nav-btn next-btn" id="allNext">다음 카드 →</button><button class="nav-btn" id="allAgain">🔊 다시</button></div>';$('#allSpeak').onclick=()=>speak(card.word);$('#allWord').onclick=()=>speak(card.word);$('#allWord').style.cursor='pointer';$('#allAgain').onclick=()=>speak(card.word);loadPhoto('all',card)}else{focus.innerHTML='<div class="text-only-box"><button id="textOnlyWord" aria-label="'+esc(card.word)+' 읽기">'+esc(card.word)+'</button><p>글자를 누르면 읽어 줘요.</p></div><div class="bottom-actions"><button class="nav-btn" id="allPrev" '+(state.allIndex===0?'disabled':'')+'>← 이전</button><button class="nav-btn next-btn" id="allNext">다음 글자 →</button><button class="nav-btn" id="showPicture">그림 보기</button></div>';$('#textOnlyWord').onclick=()=>speak(card.word);$('#showPicture').onclick=()=>{state.allMode='photo';renderAll()}}
$('#modePhoto').onclick=()=>{state.allMode='photo';renderAll()};$('#modeText').onclick=()=>{state.allMode='text';renderAll()};$('#allPrev').onclick=()=>{if(state.allIndex>0){state.allIndex--;renderAll()}};$('#allNext').onclick=()=>{if(state.allIndex<199){state.allIndex++;renderAll()}else toast('이 단계의 200장을 모두 봤어요!')};const grid=$('#allGrid');cards.forEach((c,i)=>{const b=document.createElement('button');b.className='all-word '+(i===state.allIndex?'current':'');b.innerHTML='<small>'+String(i+1).padStart(3,'0')+'</small>'+esc(c.word);b.onclick=()=>{state.allIndex=i;renderAll()};grid.appendChild(b)})}
function makeQuiz(){const cards=currentCards();const target=cards[Math.floor(Math.random()*cards.length)];const others=cards.filter(c=>c.id!==target.id).sort(()=>Math.random()-.5).slice(0,2);state.quiz=target;state.choices=[target,...others].sort(()=>Math.random()-.5);state.answered=false}
function renderQuiz(){if(!state.quiz)makeQuiz();const card=state.quiz;$('#content').innerHTML='<div class="quiz-box"><h1 class="section-title">그림 퀴즈</h1><p class="section-note">그림을 보고 알맞은 한글을 골라 보세요. 틀린 문제는 오답 노트에 모여요.</p>'+photoHTML('quiz',card,true)+'<button class="hint" id="hint">🔊 힌트 듣기</button><div class="choice-grid" id="choices"></div><div class="cheer" id="cheer"></div><button class="quiz-next" id="quizNext">다른 문제 →</button></div>';$('#hint').onclick=()=>speak(card.word);const box=$('#choices');state.choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c.word;b.onclick=()=>answerQuiz(c,b);box.appendChild(b)});$('#quizNext').onclick=()=>{makeQuiz();renderQuiz()};loadPhoto('quiz',card,true)}
function answerQuiz(choice,button){if(state.answered)return;const correct=choice.id===state.quiz.id;if(correct){state.answered=true;button.classList.add('correct');$('#cheer').textContent='잘했어! 나 최고야!';speak('잘했어! 나 최고야!');burst();removeWrong(state.quiz)}else{button.classList.add('wrong');addWrong(state.quiz);$('#cheer').textContent='다시 해 보자!';setTimeout(()=>button.classList.remove('wrong'),500)}}
function renderWrong(){const ids=wrongForLevel();const cards=ids.map(cardById).filter(Boolean);if(!cards.length){$('#content').innerHTML='<h1 class="section-title">오답 노트</h1><div class="empty"><strong>아직 오답이 없어요!</strong>그림 퀴즈에서 틀린 단어가 여기에 모여요.</div>';return}$('#content').innerHTML='<h1 class="section-title">오답 노트</h1><p class="section-note">틀린 단어를 누르면 그림 카드로 다시 볼 수 있어요.</p><div class="wrong-list" id="wrongList"></div>';const list=$('#wrongList');cards.forEach(card=>{const b=document.createElement('button');b.className='wrong-card';b.textContent=card.word;b.onclick=()=>{const idx=currentCards().findIndex(x=>x.id===card.id);state.allIndex=idx;state.allMode='photo';state.tab='all';render()};list.appendChild(b)})}
document.addEventListener('DOMContentLoaded',()=>{restore();renderAnimalChoices();document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{state.tab=t.dataset.tab;render()}));$('#changeFriend').addEventListener('click',()=>{$('#mainApp').classList.add('hidden');$('#pickScreen').classList.remove('hidden')});if('speechSynthesis' in window){setupVoices();window.speechSynthesis.onvoiceschanged=setupVoices;setTimeout(setupVoices,500)}if(state.friend)showApp()});
</script>
